    <text class="f" x="528" y="256" font-size="18" font-weight="700" fill="#e8edf7">Grafana</text>
    <text class="f" x="528" y="280" font-size="13" fill="#64748b">localhost:3000</text>
    <rect x="456" y="302" width="96" height="26" rx="13" fill="#6366f1" fill-opacity=".14" stroke="#6366f1" stroke-opacity=".35"/>
    <text class="f" x="504" y="319" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">Gestione</text>
