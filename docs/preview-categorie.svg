<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Mockup della pagina Categorie e domini di Ghibiri Hub">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="titleC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowC1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f19" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0f19" stop-opacity=".95"/>
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .row { animation: riseC .65s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes riseC { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .r1 { animation-delay: .05s } .r2 { animation-delay: .13s } .r3 { animation-delay: .21s }
      .r4 { animation-delay: .29s } .r5 { animation-delay: .37s } .r6 { animation-delay: .45s }
      .amb { animation: ambC 8s ease-in-out infinite; }
      @keyframes ambC { 0%,100% { opacity: .72 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1000" height="640" fill="url(#bgC)"/>
  <circle class="amb" cx="150" cy="90" r="280" fill="url(#glowC1)"/>
  <circle class="amb" cx="900" cy="580" r="280" fill="url(#glowC2)"/>

  <!-- Header -->
  <text class="f" x="40" y="44" font-size="20" font-weight="700" fill="url(#titleC)">Ghibiri Hub</text>
  <text class="f" x="648" y="42" font-size="13" font-weight="600" fill="#8b9cb8" text-anchor="middle">Dashboard</text>
  <rect x="700" y="20" width="216" height="34" rx="17" fill="#6366f1" opacity=".16"/>
  <text class="f" x="808" y="42" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">Categorie e domini</text>
  <circle cx="957" cy="37" r="15" fill="#131a2a" stroke="#1f2a44"/>
  <rect x="949" y="33" width="12" height="10" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="953" y1="33" x2="957" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#1b2437" stroke-width="1"/>

  <!-- Titolo pagina -->
  <text class="f" x="40" y="112" font-size="22" font-weight="700" fill="#e8edf7">Categorie e domini</text>
  <text class="f" x="40" y="136" font-size="12" fill="#64748b">Le categorie definiscono colore e raggruppamento; i domini compongono gli URL dei servizi.</text>

  <!-- Sezione: Categorie -->
  <text class="f" x="40" y="186" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="1">CATEGORIE</text>
  <rect x="790" y="166" width="170" height="34" rx="12" fill="#6366f1"/>
  <text class="f" x="875" y="188" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">+ Nuova Categoria</text>

  <!-- Card categoria: Gestione -->
  <g class="row r1">
    <rect x="40" y="216" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".55" stroke="#1f2a44" filter="url(#shadowC)"/>
    <rect x="60" y="250" width="36" height="36" rx="12" fill="#6366f1" fill-opacity=".15" stroke="#6366f1" stroke-opacity=".4"/>
    <circle cx="78" cy="268" r="6" fill="#6366f1"/>
    <text class="f" x="108" y="268" font-size="14" font-weight="600" fill="#ffffff">Gestione</text>
    <text class="f" x="108" y="288" font-size="11.5" fill="#94a3b8">3 servizi</text>
    <circle cx="256" cy="268" r="14" fill="#1b2437"/>
    <line x1="251" y1="273" x2="261" y2="263" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="288" cy="268" r="14" fill="#1b2437"/>
    <rect x="282" y="266" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="279" y1="264" x2="297" y2="264" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Card categoria: Media -->
  <g class="row r2">
    <rect x="352" y="216" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".55" stroke="#1f2a44" filter="url(#shadowC)"/>
    <rect x="372" y="250" width="36" height="36" rx="12" fill="#ec4899" fill-opacity=".15" stroke="#ec4899" stroke-opacity=".4"/>
    <circle cx="390" cy="268" r="6" fill="#ec4899"/>
    <text class="f" x="420" y="268" font-size="14" font-weight="600" fill="#ffffff">Media</text>
    <text class="f" x="420" y="288" font-size="11.5" fill="#94a3b8">3 servizi</text>
    <circle cx="568" cy="268" r="14" fill="#1b2437"/>
    <line x1="563" y1="273" x2="573" y2="263" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="600" cy="268" r="14" fill="#1b2437"/>
    <rect x="594" y="266" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="591" y1="264" x2="609" y2="264" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Card categoria: Monitoraggio -->
  <g class="row r3">
    <rect x="664" y="216" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".55" stroke="#1f2a44" filter="url(#shadowC)"/>
    <rect x="684" y="250" width="36" height="36" rx="12" fill="#f59e0b" fill-opacity=".15" stroke="#f59e0b" stroke-opacity=".4"/>
    <circle cx="702" cy="268" r="6" fill="#f59e0b"/>
    <text class="f" x="732" y="268" font-size="14" font-weight="600" fill="#ffffff">Monitoraggio</text>
    <text class="f" x="732" y="288" font-size="11.5" fill="#94a3b8">2 servizi</text>
    <circle cx="880" cy="268" r="14" fill="#1b2437"/>
    <line x1="875" y1="273" x2="885" y2="263" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="912" cy="268" r="14" fill="#1b2437"/>
    <rect x="906" y="266" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="903" y1="264" x2="921" y2="264" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Sezione: Domini -->
  <text class="f" x="40" y="378" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="1">DOMINI</text>
  <text class="f" x="118" y="378" font-size="11" fill="#64748b">— i domini disponibili nella tendina del form servizio</text>
  <rect x="790" y="358" width="170" height="34" rx="12" fill="#6366f1"/>
  <text class="f" x="875" y="380" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">+ Nuovo Dominio</text>

  <!-- Card dominio: ghibiri.it -->
  <g class="row r4">
    <rect x="40" y="408" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".55" stroke="#1f2a44" filter="url(#shadowC)"/>
    <rect x="60" y="442" width="36" height="36" rx="12" fill="#6366f1" fill-opacity=".15" stroke="#6366f1" stroke-opacity=".4"/>
    <circle cx="78" cy="460" r="11" fill="none" stroke="#a5b4fc" stroke-width="2"/>
    <ellipse cx="78" cy="460" rx="5" ry="11" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <line x1="67" y1="460" x2="89" y2="460" stroke="#a5b4fc" stroke-width="1.6"/>
    <text class="f" x="108" y="460" font-size="14" font-weight="600" fill="#ffffff">ghibiri.it</text>
    <text class="f" x="108" y="480" font-size="11.5" fill="#94a3b8">6 servizi</text>
    <circle cx="256" cy="460" r="14" fill="#1b2437"/>
    <line x1="251" y1="465" x2="261" y2="455" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="288" cy="460" r="14" fill="#1b2437"/>
    <rect x="282" y="458" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="279" y1="456" x2="297" y2="456" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Card dominio: homelab.local -->
  <g class="row r5">
    <rect x="352" y="408" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".55" stroke="#1f2a44" filter="url(#shadowC)"/>
    <rect x="372" y="442" width="36" height="36" rx="12" fill="#6366f1" fill-opacity=".15" stroke="#6366f1" stroke-opacity=".4"/>
    <circle cx="390" cy="460" r="11" fill="none" stroke="#a5b4fc" stroke-width="2"/>
    <ellipse cx="390" cy="460" rx="5" ry="11" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <line x1="379" y1="460" x2="401" y2="460" stroke="#a5b4fc" stroke-width="1.6"/>
    <text class="f" x="420" y="460" font-size="14" font-weight="600" fill="#ffffff">homelab.local</text>
    <text class="f" x="420" y="480" font-size="11.5" fill="#94a3b8">2 servizi</text>
    <circle cx="568" cy="460" r="14" fill="#1b2437"/>
    <line x1="563" y1="465" x2="573" y2="455" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="600" cy="460" r="14" fill="#1b2437"/>
    <rect x="594" y="458" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="591" y1="456" x2="609" y2="456" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Card dominio: nuova riga (placeholder) -->
  <g class="row r6">
    <rect x="664" y="408" width="296" height="104" rx="18" fill="#131a2a" fill-opacity=".35" stroke="#1f2a44" stroke-dasharray="6 6"/>
    <text class="f" x="812" y="455" font-size="12" fill="#64748b" text-anchor="middle">Aggiungi un dominio per</text>
    <text class="f" x="812" y="474" font-size="12" fill="#64748b" text-anchor="middle">comporre gli URL dei servizi</text>
  </g>

  <rect x="0" y="540" width="1000" height="100" fill="url(#fadeC)"/>
</svg>
