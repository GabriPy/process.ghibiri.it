    <rect x="432" y="226" width="5" height="110" rx="2.5" fill="#6366f1"/>
    <rect x="456" y="230" width="54" height="54" rx="15" fill="#0f1626" stroke="#1f2a44"/>
    <text class="f" x="483" y="265" font-size="22" font-weight="700" fill="#818cf8" text-anchor="middle">G</text>
    <circle cx="766" cy="242" r="10" fill="#22c55e" opacity=".18"/>
