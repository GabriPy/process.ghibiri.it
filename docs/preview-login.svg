<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Mockup della schermata di login con PIN di Ghibiri Hub">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="titleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="btnL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d70f5"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glowL1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowL" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .box { animation: riseL .6s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes riseL { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
      .b1 { animation-delay: .1s } .b2 { animation-delay: .22s } .b3 { animation-delay: .34s } .b4 { animation-delay: .46s }
      .focus { animation: focusL 2.4s ease-in-out infinite; }
      @keyframes focusL { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      .amb { animation: ambL 7s ease-in-out infinite; }
      @keyframes ambL { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
      .caret { animation: caretL 1.1s step-end infinite; }
      @keyframes caretL { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1000" height="640" fill="url(#bgL)"/>
  <circle class="amb" cx="180" cy="120" r="300" fill="url(#glowL1)"/>
  <circle class="amb" cx="850" cy="560" r="300" fill="url(#glowL2)"/>

  <!-- Card di login -->
  <rect x="300" y="96" width="400" height="448" rx="26" fill="#111827" fill-opacity=".72" stroke="#1f2a44" filter="url(#shadowL)"/>

  <g class="box b1">
    <rect x="472" y="136" width="56" height="56" rx="18" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".35"/>
    <rect x="489" y="170" width="22" height="16" rx="4" fill="none" stroke="#c7d2fe" stroke-width="2.4"/>
    <path d="M493 170 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#c7d2fe" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <g class="box b2">
    <text class="f" x="500" y="234" font-size="24" font-weight="700" fill="url(#titleL)" text-anchor="middle">Ghibiri Hub</text>
    <text class="f" x="500" y="260" font-size="13" fill="#64748b" text-anchor="middle">Inserisci il PIN per accedere</text>
  </g>

  <!-- Caselle PIN -->
  <g class="box b3">
    <rect x="375" y="292" width="52" height="62" rx="15" fill="#0f1626" stroke="#1f2a44" stroke-width="1.4"/>
    <circle cx="401" cy="323" r="7" fill="#e8edf7"/>
    <rect x="441" y="292" width="52" height="62" rx="15" fill="#0f1626" stroke="#1f2a44" stroke-width="1.4"/>
    <circle cx="467" cy="323" r="7" fill="#e8edf7"/>
    <rect x="507" y="292" width="52" height="62" rx="15" fill="#0f1626" stroke="#6366f1" stroke-width="2"/>
    <circle class="focus" cx="533" cy="323" r="7" fill="#a5b4fc"/>
    <rect x="573" y="292" width="52" height="62" rx="15" fill="#0f1626" stroke="#1f2a44" stroke-width="1.4"/>
  </g>

  <g class="box b4">
    <rect x="375" y="386" width="250" height="50" rx="15" fill="url(#btnL)"/>
    <text class="f" x="500" y="417" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Accedi</text>
    <text class="f" x="500" y="470" font-size="11" fill="#475569" text-anchor="middle">Il PIN è configurato in <tspan fill="#64748b">AUTH_PIN</tspan> sul docker compose</text>
    <text class="f" x="500" y="500" font-size="11" fill="#475569" text-anchor="middle">Sessione valida 30 giorni · logout dall'header <tspan class="caret" fill="#818cf8">|</tspan></text>
  </g>
</svg>
