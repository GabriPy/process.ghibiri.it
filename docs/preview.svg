  <g class="card d4">
    <rect x="48" y="428" width="360" height="150" rx="18" fill="#131a2a" stroke="#1f2a44" filter="url(#shadow)"/>
    <rect x="48" y="448" width="5" height="110" rx="2.5" fill="#ec4899"/>
    <rect x="72" y="452" width="54" height="54" rx="15" fill="#0f1626" stroke="#1f2a44"/>
    <text class="f" x="99" y="487" font-size="22" font-weight="700" fill="#f472b6" text-anchor="middle">J</text>
    <circle cx="382" cy="464" r="10" fill="#22c55e" opacity=".18"/>
    <circle class="pulse" cx="382" cy="464" r="6" fill="#22c55e"/>
    <text class="f" x="144" y="478" font-size="18" font-weight="700" fill="#e8edf7">Jellyfin</text>
    <text class="f" x="144" y="502" font-size="13" fill="#64748b">localhost:8096</text>
    <rect x="72" y="524" width="78" height="26" rx="13" fill="#ec4899" fill-opacity=".14" stroke="#ec4899" stroke-opacity=".35"/>
    <text class="f" x="111" y="541" font-size="12" font-weight="600" fill="#f9a8d4" text-anchor="middle">Media</text>
    <circle cx="330" cy="537" r="14" fill="#1b2437"/>
    <line x1="325" y1="542" x2="335" y2="532" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="368" cy="537" r="14" fill="#1b2437"/>
    <rect x="362" y="535" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="359" y1="533" x2="377" y2="533" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card 5: Immich -->
  <g class="card d5">
    <rect x="432" y="428" width="360" height="150" rx="18" fill="#131a2a" stroke="#1f2a44" filter="url(#shadow)"/>
    <rect x="432" y="448" width="5" height="110" rx="2.5" fill="#ec4899"/>
    <rect x="456" y="452" width="54" height="54" rx="15" fill="#0f1626" stroke="#1f2a44"/>
    <text class="f" x="483" y="487" font-size="22" font-weight="700" fill="#f472b6" text-anchor="middle">I</text>
    <circle cx="766" cy="464" r="10" fill="#22c55e" opacity=".18"/>
    <circle class="pulse" cx="766" cy="464" r="6" fill="#22c55e"/>
