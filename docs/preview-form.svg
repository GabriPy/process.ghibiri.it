<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Mockup del form di creazione servizio di Ghibiri Hub">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="btnF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d70f5"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glowF" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowF" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity=".6"/>
    </filter>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .modal { animation: riseF .55s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes riseF { from { opacity: 0; transform: translateY(26px) scale(.985) } to { opacity: 1; transform: translateY(0) scale(1) } }
      .field { animation: fadeF .5s ease-out both; }
      @keyframes fadeF { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .k1 { animation-delay: .12s } .k2 { animation-delay: .2s } .k3 { animation-delay: .28s }
      .k4 { animation-delay: .36s } .k5 { animation-delay: .44s } .k6 { animation-delay: .52s }
      .caret { animation: caretF 1.1s step-end infinite; }
      @keyframes caretF { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      .amb { animation: ambF 8s ease-in-out infinite; }
      @keyframes ambF { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1000" height="640" fill="url(#bgF)"/>
  <circle class="amb" cx="500" cy="320" r="340" fill="url(#glowF)"/>

  <!-- Dashboard in secondo piano -->
  <g opacity=".45">
    <rect x="40" y="44" width="120" height="26" rx="9" fill="#1f2a44"/>
    <rect x="40" y="86" width="300" height="36" rx="12" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="390" y="86" width="180" height="36" rx="12" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="600" y="86" width="130" height="36" rx="12" fill="#6366f1"/>
    <rect x="40" y="160" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="360" y="160" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="680" y="160" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="40" y="310" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="360" y="310" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="680" y="310" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="40" y="460" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="360" y="460" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
    <rect x="680" y="460" width="280" height="120" rx="16" fill="#131a2a" stroke="#1f2a44"/>
  </g>
  <rect width="1000" height="640" fill="#000000" opacity=".66"/>

  <!-- Modal -->
  <g class="modal">
    <rect x="220" y="60" width="560" height="540" rx="24" fill="#111827" fill-opacity=".97" stroke="#1f2a44" filter="url(#shadowF)"/>
    <text class="f" x="248" y="104" font-size="18" font-weight="700" fill="#e8edf7">Aggiungi Servizio</text>
    <line x1="734" y1="92" x2="746" y2="104" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="746" y1="92" x2="734" y2="104" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Protocollo -->
    <g class="field k1">
      <text class="f" x="248" y="140" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">PROTOCOLLO</text>
      <rect x="248" y="148" width="504" height="44" rx="12" fill="#0f1626" stroke="#1f2a44"/>
      <text class="f" x="268" y="176" font-size="13" fill="#e8edf7">https</text>
      <path d="M726 168 l7 7 l7 -7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <rect x="360" y="152" width="96" height="36" rx="10" fill="#6366f1" fill-opacity=".14" stroke="#6366f1" stroke-opacity=".3"/>
      <text class="f" x="408" y="175" font-size="11" fill="#a5b4fc" text-anchor="middle">predefinito</text>
    </g>

    <!-- Nome -->
    <g class="field k2">
      <text class="f" x="248" y="216" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">NOME</text>
      <rect x="248" y="224" width="504" height="44" rx="12" fill="#0f1626" stroke="#6366f1"/>
      <text class="f" x="268" y="252" font-size="13" fill="#e8edf7">Portainer</text>
      <rect class="caret" x="336" y="240" width="2" height="18" rx="1" fill="#818cf8"/>
    </g>

    <!-- Sottodominio + Dominio -->
    <g class="field k3">
      <text class="f" x="248" y="292" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">SOTTODOMINIO</text>
      <rect x="248" y="300" width="236" height="44" rx="12" fill="#0f1626" stroke="#1f2a44"/>
      <text class="f" x="266" y="328" font-size="13" fill="#e8edf7">portainer</text>

      <text class="f" x="516" y="292" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">DOMINIO</text>
      <rect x="516" y="300" width="236" height="44" rx="12" fill="#0f1626" stroke="#1f2a44"/>
      <text class="f" x="534" y="328" font-size="13" fill="#e8edf7">ghibiri.it</text>
      <path d="M722 320 l7 7 l7 -7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Anteprima URL -->
    <g class="field k4">
      <text class="f" x="248" y="370" font-size="11" fill="#64748b">URL risultante:</text>
      <text class="f" x="336" y="370" font-size="11" font-weight="600" fill="#a5b4fc">https://portainer.ghibiri.it</text>
      <line x1="500" y1="378" x2="752" y2="378" stroke="#1f2a44"/>
    </g>

    <!-- Logo -->
    <g class="field k5">
      <text class="f" x="248" y="404" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">URL LOGO (OPZIONALE)</text>
      <rect x="248" y="412" width="504" height="44" rx="12" fill="#0f1626" stroke="#1f2a44"/>
      <text class="f" x="268" y="440" font-size="13" fill="#475569">https://link-al-logo.png</text>
    </g>

    <!-- Categoria -->
    <g class="field k6">
      <text class="f" x="248" y="480" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing=".7">CATEGORIA</text>
      <rect x="248" y="488" width="504" height="44" rx="12" fill="#0f1626" stroke="#1f2a44"/>
      <circle cx="272" cy="510" r="5" fill="#6366f1"/>
      <text class="f" x="288" y="516" font-size="13" fill="#e8edf7">Gestione</text>
      <path d="M726 508 l7 7 l7 -7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Azioni -->
    <text class="f" x="620" y="578" font-size="12.5" fill="#94a3b8" text-anchor="middle">Annulla</text>
    <rect x="650" y="552" width="102" height="42" rx="13" fill="url(#btnF)"/>
    <text class="f" x="701" y="579" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Salva</text>
  </g>
</svg>
