version: '3.8'

services:
  ghibiri-hub:
    build: .
    container_name: ghibiri-hub
    restart: unless-stopped
    ports:
      - "3111:3111"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3111
      # PIN a 4 cifre per l'accesso. Modificalo (es. AUTH_PIN=4821 docker compose up -d)
      - AUTH_PIN=${AUTH_PIN:-1234}