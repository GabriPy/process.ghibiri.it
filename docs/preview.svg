    <rect x="1130" y="313" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="1127" y1="311" x2="1145" y2="311" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
