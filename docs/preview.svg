    <text class="f" x="912" y="280" font-size="13" fill="#64748b">localhost:3001</text>
    <rect x="840" y="302" width="96" height="26" rx="13" fill="#6366f1" fill-opacity=".14" stroke="#6366f1" stroke-opacity=".35"/>
