    <text class="f" x="528" y="502" font-size="13" fill="#64748b">localhost:2283</text>
    <rect x="456" y="524" width="78" height="26" rx="13" fill="#ec4899" fill-opacity=".14" stroke="#ec4899" stroke-opacity=".35"/>
    <text class="f" x="495" y="541" font-size="12" font-weight="600" fill="#f9a8d4" text-anchor="middle">Media</text>
    <circle cx="714" cy="537" r="14" fill="#1b2437"/>
    <line x1="709" y1="542" x2="719" y2="532" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="752" cy="537" r="14" fill="#1b2437"/>
    <rect x="746" y="535" width="12" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="743" y1="533" x2="761" y2="533" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card 6: Paperless (offline) -->
  <g class="card d6">
    <rect x="816" y="428" width="360" height="150" rx="18" fill="#131a2a" stroke="#1f2a44" filter="url(#shadow)"/>
    <rect x="816" y="448" width="5" height="110" rx="2.5" fill="#ec4899"/>
    <rect x="840" y="452" width="54" height="54" rx="15" fill="#0f1626" stroke="#1f2a44"/>
    <text class="f" x="867" y="487" font-size="22" font-weight="700" fill="#f472b6" text-anchor="middle">P</text>
    <circle cx="1150" cy="464" r="10" fill="#ef4444" opacity=".18"/>
    <circle class="pulse-slow" cx="1150" cy="464" r="6" fill="#ef4444"/>
    <text class="f" x="912" y="478" font-size="18" font-weight="700" fill="#e8edf7">Paperless</text>
    <text class="f" x="912" y="502" font-size="13" fill="#64748b">localhost:8000</text>
    <rect x="840" y="524" width="78" height="26" rx="13" fill="#ec4899" fill-opacity=".14" stroke="#ec4899" stroke-opacity=".35"/>
    <text class="f" x="879" y="541" font-size="12" font-weight="600" fill="#f9a8d4" text-anchor="middle">Media</text>
    <circle cx="1098" cy="537" r="14" fill="#1b2437"/>
    <line x1="1093" y1="542" x2="1103" y2="532" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
