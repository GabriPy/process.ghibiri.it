  <circle cx="54" cy="396" r="6" fill="#ec4899"/>
  <text class="f" x="74" y="403" font-size="18" font-weight="700" fill="#e8edf7">Media</text>
  <rect x="134" y="384" width="32" height="22" rx="11" fill="#1b2437"/>
  <text class="f" x="150" y="400" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">3</text>

