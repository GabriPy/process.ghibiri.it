<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibiri Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="glass sticky top-0 z-40 px-6 py-4 mb-8 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                <i class="fa-solid fa-server text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Ghibiri Hub</h1>
                <p class="text-xs text-gray-400">Homelab Dashboard</p>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="relative flex-1 sm:w-64">
                <i
                    class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderServices()" placeholder="Cerca servizio..."
                    class="w-full bg-gray-900/80 border border-gray-700/60 rounded-xl pl-9 pr-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="openModal()"
                class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Aggiungi</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 flex-1 w-full pb-12">
        <div id="servicesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        <div id="noResults" class="hidden text-center py-16 text-gray-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-40"></i>
            <p>Nessun servizio trovato.</p>
        </div>
    </main>

    <!-- Modal Aggiungi / Modifica -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-2xl p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 id="modalTitle" class="text-lg font-bold mb-4">Aggiungi Servizio</h2>
            <form id="serviceForm" onsubmit="saveService(event)" class="space-y-4">
                <input type="hidden" id="serviceId">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">NOME</label>
                    <input type="text" id="nameInput" required placeholder="Es. Portainer"
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">URL COMPLETO</label>
                    <input type="url" id="urlInput" required placeholder="https://portainer.tuodominio.it"
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">URL LOGO (Opzionale)</label>
                    <input type="url" id="logoInput" placeholder="https://link-al-logo.png"
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">CATEGORIA</label>
                    <input type="text" id="categoryInput" placeholder="Es. Monitoraggio, System, Media"
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 text-sm text-gray-400 hover:text-white">Annulla</button>
                    <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-5 py-2 rounded-xl transition">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let services = [];

        async function loadServices() {
            try {
                const res = await fetch('/api/services');
                services = await res.json();
                renderServices();
            } catch (err) {
                console.error("Errore caricamento servizi:", err);
            }
        }

        const categoryPalette = ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4', '#a855f7', '#ef4444', '#14b8a6', '#f97316', '#3b82f6'];

        function getCategoryColor(cat) {
            const key = (cat || 'Generale').trim().toLowerCase();
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
            }
            return categoryPalette[hash % categoryPalette.length];
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        async function checkStatuses() {
            const dots = document.querySelectorAll('.status-dot');
            await Promise.all([...dots].map(async (dot) => {
                let online = false;
                try {
                    const res = await fetch('/api/check?url=' + encodeURIComponent(dot.dataset.url));
                    const data = await res.json();
                    online = !!data.online;
                } catch (e) {
                    online = false;
                }
                dot.style.backgroundColor = online ? '#22c55e' : '#ef4444';
            }));
        }

        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = services
                .filter(s =>
                    s.name.toLowerCase().includes(query) ||
                    (s.category && s.category.toLowerCase().includes(query))
                )
                .sort((a, b) => {
                    const ca = (a.category || 'Generale').trim().toLowerCase();
                    const cb = (b.category || 'Generale').trim().toLowerCase();
                    if (ca !== cb) return ca.localeCompare(cb);
                    return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
                });

            document.getElementById('noResults').classList.toggle('hidden', filtered.length > 0);

            filtered.forEach(s => {
                const logoSrc = s.logo && s.logo.trim() !== '' ? s.logo : '/default-icon.svg';
                const color = getCategoryColor(s.category);
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-5 relative group cursor-pointer flex flex-col justify-between';
                card.style.borderLeft = `3px solid ${hexToRgba(color, 0.7)}`;

                // Clic sull'intera card apre il servizio
                card.onclick = (e) => {
                    if (!e.target.closest('.action-btn')) {
                        window.open(s.url, '_blank');
                    }
                };

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-xl bg-gray-800/80 border border-gray-700/50 flex items-center justify-center p-2 overflow-hidden">
                                <img src="${logoSrc}" alt="${s.name}" class="w-full h-full object-contain" onerror="this.src='/default-icon.svg'">
                            </div>
                            <span class="status-dot absolute -top-1 -left-1 w-3 h-3 rounded-full border-2" style="background-color:#6b7280; border-color:#0b0f19" data-url="${s.url}"></span>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editService(${s.id})" class="action-btn p-2 text-gray-400 hover:text-indigo-400 rounded-lg hover:bg-gray-800" title="Modifica">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteService(${s.id})" class="action-btn p-2 text-gray-400 hover:text-red-400 rounded-lg hover:bg-gray-800" title="Elimina">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md border" style="color:${color}; background-color:${hexToRgba(color, 0.1)}; border-color:${hexToRgba(color, 0.3)}">
                            ${s.category || 'Generale'}
                        </span>
                        <h3 class="text-base font-semibold mt-1 text-white group-hover:text-indigo-300 transition-colors">${s.name}</h3>
                        <p class="text-xs text-gray-400 truncate mt-0.5">${s.url.replace(/^https?:\/\//, '')}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            checkStatuses();
        }

        function openModal() {
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceId').value = '';
            document.getElementById('modalTitle').innerText = 'Aggiungi Servizio';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editService(id) {
            const s = services.find(x => x.id === id);
            if (!s) return;
            document.getElementById('serviceId').value = s.id;
            document.getElementById('nameInput').value = s.name;
            document.getElementById('urlInput').value = s.url;
            document.getElementById('logoInput').value = s.logo || '';
            document.getElementById('categoryInput').value = s.category || '';
            document.getElementById('modalTitle').innerText = 'Modifica Servizio';
            document.getElementById('modal').classList.remove('hidden');
        }

        async function saveService(e) {
            e.preventDefault();
            const id = document.getElementById('serviceId').value;
            const payload = {
                name: document.getElementById('nameInput').value,
                url: document.getElementById('urlInput').value,
                logo: document.getElementById('logoInput').value,
                category: document.getElementById('categoryInput').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/services/${id}` : '/api/services';

            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal();
            loadServices();
        }

        async function deleteService(id) {
            if (!confirm('Sicuro di voler eliminare questo servizio?')) return;
            await fetch(`/api/services/${id}`, { method: 'DELETE' });
            loadServices();
        }

        loadServices();
    </script>
</body>

</html>
